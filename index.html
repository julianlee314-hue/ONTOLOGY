<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONTOLOGY Kanban</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --cork:#c89a64; --cork2:#b8854f; --cork-dot:rgba(90,52,20,.18);
  --frame:#6b4426; --ink:#2b2118; --ink-soft:#5d4c3c; --paper:#fffdf6;
  --panel:#fffaf0; --panel-ink:#2b2118; --line:rgba(60,40,20,.15);
  --col-bg:rgba(255,248,235,.42); --col-head:#fff6e2; --shadow:0 2px 0 rgba(0,0,0,.06),0 6px 14px rgba(60,35,10,.28);
  --accent:#e2513b; --accent-ink:#fff; --chip:#fff7e8; --header:#3a2616; --header-ink:#fff5e4;
  --font:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --hand:"Marker Felt","Chalkboard SE","Bradley Hand","Segoe Print","Comic Sans MS",var(--font);
}
html[data-theme="dark"]{
  --cork:#2a211b; --cork2:#211a15; --cork-dot:rgba(255,220,180,.05);
  --frame:#120d0a; --ink:#f3e7d6; --ink-soft:#c3b29d; --paper:#2c241e;
  --panel:#231c17; --panel-ink:#f3e7d6; --line:rgba(255,230,200,.12);
  --col-bg:rgba(0,0,0,.25); --col-head:#30261f; --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.55);
  --chip:#33291f; --header:#140f0b; --header-ink:#f6e8d4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);
  background-color:var(--cork);
  background-image:radial-gradient(var(--cork-dot) 1px,transparent 1.6px),radial-gradient(var(--cork-dot) 1px,transparent 1.4px),linear-gradient(135deg,var(--cork),var(--cork2));
  background-size:11px 11px,17px 17px,100% 100%;background-position:0 0,5px 7px,0 0;background-attachment:fixed;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--header);color:var(--header-ink);padding:14px 20px 12px;border-bottom:6px solid var(--frame);box-shadow:0 4px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:20}
.titlebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--hand);font-size:28px;margin:0;letter-spacing:.3px;font-weight:700}
.meta{font-size:13px;opacity:.8}
.totals{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tot{background:rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.tot b{font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.waitbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid #ffb347;background:transparent;color:#ffd38a;border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:15px}
.waitbtn .n{background:#ffb347;color:#3a2616;border-radius:999px;padding:1px 9px;font-size:13px}
.waitbtn[aria-pressed="true"]{background:#ffb347;color:#2b1a0b;box-shadow:0 0 0 4px rgba(255,179,71,.3)}
.waitbtn[aria-pressed="true"] .n{background:#2b1a0b;color:#ffd38a}
.search{flex:1 1 200px;min-width:160px;max-width:340px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--header-ink)}
.search::placeholder{color:rgba(255,240,220,.6)}
.sel{padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#4a3220;color:var(--header-ink);max-width:220px}
html[data-theme="dark"] .sel{background:#241a12}
.tbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--header-ink);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.18)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 2px}
.chip{border:none;cursor:pointer;border-radius:999px;padding:5px 11px 5px 8px;font-size:12.5px;background:var(--chip);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2);display:inline-flex;align-items:center;gap:6px;opacity:.9}
.chip .sw{width:11px;height:11px;border-radius:50%;background:var(--c)}
.chip .cnt{opacity:.6;font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--c);color:#1d140c;opacity:1;font-weight:600;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.25)}
.chip[aria-pressed="true"] .sw{background:#fff}
.chip.all{padding-left:11px;--c:#ffb347}
.status{padding:4px 20px 0;font-size:12.5px;color:#2d1c0e;font-weight:600;min-height:18px}
html[data-theme="dark"] .status{color:var(--ink-soft)}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:14px;padding:12px 20px 40px;align-items:stretch;overflow-x:auto}
.col{background:var(--col-bg);border-radius:14px;border:1px solid var(--line);min-height:200px;display:flex;flex-direction:column;transition:background .15s,box-shadow .15s}
.col.over{background:rgba(255,236,170,.55);box-shadow:inset 0 0 0 3px #ffb347}
html[data-theme="dark"] .col.over{background:rgba(255,179,71,.12)}
.colhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--col-head);border-radius:14px 14px 0 0;border-bottom:3px solid var(--sc);position:sticky;top:0}
.colhead h2{margin:0;font-size:15px;font-family:var(--hand);letter-spacing:.3px}
.colhead .count{margin-left:auto;background:var(--sc);color:#fff;border-radius:999px;font-size:12px;padding:1px 9px;font-weight:700}
.cards{padding:12px 10px 14px;display:flex;flex-direction:column;gap:12px;flex:1}
.empty{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:14px 4px;font-style:italic;opacity:.8}
.note{position:relative;background:var(--nb);color:#2b2118;border-radius:3px 3px 6px 3px;padding:14px 12px 10px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;transform:rotate(var(--rot));transition:transform .12s,box-shadow .12s,opacity .15s;touch-action:manipulation;border-top:6px solid var(--c);outline:none}
.note::after{content:"";position:absolute;right:0;bottom:0;width:16px;height:16px;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.08) 50%);border-radius:0 0 6px 0}
.note:hover,.note:focus-visible{transform:rotate(0) translateY(-2px) scale(1.015);box-shadow:0 3px 0 rgba(0,0,0,.06),0 12px 22px rgba(60,35,10,.32);z-index:2}
.note:focus-visible{outline:3px solid #ffb347;outline-offset:2px}
.note .pin{position:absolute;top:-11px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8,transparent 40%),var(--c);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.note h3{margin:0 0 4px;font-size:14.5px;line-height:1.25;font-weight:700}
.note .sum{font-size:12.5px;line-height:1.35;color:#4a3b2d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .foot{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:8px;align-items:center;font-size:11px}
.tag{background:rgba(0,0,0,.07);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.area{background:var(--c);color:#1d140c;font-weight:600}
.tag.owner{color:#5a4836}
.badge-wait{background:#e2513b;color:#fff;border-radius:4px;padding:1px 6px;font-weight:700}
.badge-moved{background:#3b6fe2;color:#fff;border-radius:4px;padding:1px 6px}
.badge-mine{background:#2b2118;color:#fff3d6;border-radius:4px;padding:1px 6px}
html[data-theme="dark"] .note{filter:saturate(.85) brightness(.92)}
body.waitmode .note:not(.waiting){opacity:.28;filter:grayscale(.6)}
body.waitmode .note.waiting{box-shadow:0 0 0 3px #e2513b,var(--shadow)}
.note.dragging-src{opacity:.25}
.ghost{position:fixed;pointer-events:none;z-index:100;transform:rotate(4deg) scale(1.04);box-shadow:0 18px 30px rgba(0,0,0,.35);opacity:.95}
/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(20,12,5,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--panel);color:var(--panel-ink);z-index:60;transform:translateX(105%);transition:transform .22s ease;box-shadow:-10px 0 30px rgba(0,0,0,.3);display:flex;flex-direction:column}
.panel.open{transform:none}
.panel .phead{padding:18px 20px 14px;border-top:10px solid var(--c);border-bottom:1px solid var(--line)}
.panel .phead h2{margin:6px 0 6px;font-size:21px;line-height:1.25;font-family:var(--hand)}
.panel .close{position:absolute;top:16px;right:14px;border:none;background:transparent;font-size:24px;cursor:pointer;color:var(--ink-soft);line-height:1}
.panel .pbody{padding:6px 20px 28px;overflow:auto;flex:1}
.panel h4{margin:16px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft)}
.panel p{margin:0;font-size:14.5px;line-height:1.5}
.panel .waitbox{margin-top:14px;background:#fde4dc;color:#7a2112;border-left:4px solid #e2513b;padding:10px 12px;border-radius:6px;font-size:14px;font-weight:600}
html[data-theme="dark"] .panel .waitbox{background:#45201a;color:#ffc9bb}
.panel .notebox{margin-top:12px;background:rgba(59,111,226,.1);border-left:4px solid #3b6fe2;padding:8px 12px;border-radius:6px;font-size:13.5px}
.panel ul{margin:2px 0 0;padding-left:18px;font-size:14px;line-height:1.55}
.panel a{color:#c2412c;word-break:break-word}
html[data-theme="dark"] .panel a{color:#ff9c84}
.panel code{font-size:12.5px;background:rgba(0,0,0,.06);padding:2px 5px;border-radius:4px;word-break:break-all}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pbtn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.pbtn.danger{color:#b52f1c}
.psel{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.pmeta{font-size:12px;color:var(--ink-soft)}
/* modal */
dialog{border:none;border-radius:12px;padding:0;width:min(440px,94vw);background:var(--panel);color:var(--panel-ink);box-shadow:0 20px 50px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,12,5,.5)}
dialog form{padding:18px 20px}
dialog h2{margin:0 0 10px;font-family:var(--hand)}
dialog label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft);margin:10px 0 3px}
dialog input,dialog select,dialog textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
dialog .row{display:flex;gap:10px}
dialog .row>div{flex:1}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:16px 0 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(80px);background:#2b2118;color:#fff3d6;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:120;transition:transform .2s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}
.hint{font-size:11.5px;opacity:.65}
@media (max-width:760px){
  header.top{padding:10px 12px;position:static}
  h1{font-size:23px}
  .totals{margin-left:0;width:100%;gap:5px}
  .tot{padding:3px 8px;font-size:11.5px}.tot b{font-size:12.5px}
  .meta{font-size:12px}
  .titlebar{gap:4px 10px}
  .toolbar{gap:6px}
  .waitbtn{width:100%;justify-content:center;font-size:15px;padding:9px}
  .tot.wt{display:none}
  .search{max-width:none;flex:1 1 55%;padding:7px 10px}
  .sel{flex:1 1 35%;max-width:none;padding:7px 8px}
  .tbtn{flex:1 1 auto;padding:8px 8px;font-size:13px}
  .chips{padding:10px 12px 2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chip{flex:0 0 auto}
  .status{padding:4px 12px 0}
  .board{grid-template-columns:repeat(6,86vw);scroll-snap-type:x mandatory;padding:10px 12px 30px;gap:10px;-webkit-overflow-scrolling:touch}
  .col{scroll-snap-align:center}
  .colhead{position:static}
  .hint.desk{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* live link */
.live{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);color:#2b2118;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:3;transition:transform .1s,background .1s}
.live:hover,.live:focus-visible{background:#2b2118;color:#fff3d6;transform:scale(1.1)}
.note h3{padding-right:24px}
.livebtn{display:inline-flex;align-items:center;gap:6px;background:#2b2118;color:#fff3d6!important;text-decoration:none;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600}
html[data-theme="dark"] .livebtn{background:#f3e7d6;color:#2b2118!important}
.vlist{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}
footer.foot{text-align:center;font-size:12.5px;color:#3a2616;padding:4px 16px 26px;opacity:.85}
html[data-theme="dark"] footer.foot{color:var(--ink-soft)}
/* realm tabs */
.realms{display:flex;gap:8px;padding:12px 20px 0;overflow-x:auto;scrollbar-width:none}
.realm{flex:0 0 auto;border:none;cursor:pointer;text-align:left;border-radius:12px 12px 12px 12px;padding:8px 14px 8px 12px;background:var(--chip);color:var(--ink);box-shadow:0 2px 5px rgba(0,0,0,.22);border-left:6px solid var(--c);min-width:120px;opacity:.92}
.realm .rn{font-weight:800;letter-spacing:1.2px;font-size:13.5px;display:block}
.realm .rs{font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.realm .rw{color:#c2412c;font-weight:700}
html[data-theme="dark"] .realm .rw{color:#ff9c84}
.realm[aria-pressed="true"]{background:var(--c);color:#1d140c;opacity:1;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.3)}
.realm[aria-pressed="true"] .rs,.realm[aria-pressed="true"] .rw{color:#3a2616}
.realm.empty0{opacity:.6}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--header-ink);font-size:14px;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 12px;background:rgba(255,255,255,.08);white-space:nowrap}
.switch .knob{width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.3);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"]{background:rgba(127,211,168,.25);border-color:#7fd3a8}
.switch[aria-pressed="true"] .knob{background:#3aa76d}
.switch[aria-pressed="true"] .knob::after{left:16px}
/* panel lists */
.back{border:none;background:transparent;color:var(--ink-soft);cursor:pointer;padding:0;font-size:13.5px;margin-bottom:4px}
.back:hover{color:var(--ink)}
.sg{margin-top:14px}
.sg h5{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-soft)}
.sg h5 .dot{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.kid{display:block;width:100%;text-align:left;border:none;cursor:pointer;background:var(--nb);color:#2b2118;border-left:5px solid var(--c);border-radius:4px;padding:8px 10px;margin:0 0 7px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.kid:hover{filter:brightness(1.03);box-shadow:0 3px 8px rgba(0,0,0,.22)}
.kid b{font-size:14px;display:block}
.kid span{font-size:12px;color:#5a4836}
.kid .kb{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;font-size:11px}
html[data-theme="dark"] .kid{filter:saturate(.85) brightness(.92)}
.wl{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.wl li{margin-bottom:4px}
.wl a{cursor:pointer}
@media (max-width:760px){
  .realms{padding:10px 12px 0;gap:6px}
  .realm{min-width:0;padding:6px 10px}
  .realm .rn{font-size:12.5px}
  .switch{flex:1 1 100%;justify-content:center}
}
/* ---- v4: goals, history, abandoned ---- */
.goals{display:flex;gap:10px;padding:12px 20px 4px;overflow-x:auto;scrollbar-width:thin;align-items:stretch}
.goal{flex:0 0 auto;position:relative;min-width:168px;max-width:230px;text-align:left;border:none;cursor:pointer;color:#1d140c;background:linear-gradient(180deg,var(--gc),color-mix(in srgb,var(--gc) 78%,#000));
  border-radius:10px 10px 10px 10px;padding:9px 34px 9px 12px;box-shadow:0 3px 8px rgba(0,0,0,.25);opacity:.9;transition:transform .12s,opacity .12s,box-shadow .12s}
.goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:10px 0 0 10px;background:rgba(255,255,255,.45)}
.goal .gt{display:block;font-weight:800;font-size:13.5px;line-height:1.2;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gs{display:block;font-size:11px;color:rgba(255,255,255,.92);margin-top:2px;white-space:nowrap}
.goal .gbar{display:flex;height:5px;border-radius:999px;overflow:hidden;margin-top:6px;background:rgba(255,255,255,.25)}
.goal .gbar i{display:block;height:100%}
.goal .gw{background:#fff;color:#c2412c;border-radius:999px;padding:0 6px;font-weight:800;margin-left:4px}
.goal .tl{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#2b2118;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.goal .tl:hover{background:#fff;transform:scale(1.08)}
.goal:hover{opacity:1;transform:translateY(-1px)}
.goal[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gc),0 6px 14px rgba(0,0,0,.3)}
.goals.dim .goal[aria-pressed="false"]{opacity:.55}
.goal.allg{--gc:#5a4330;min-width:110px}
.goalinfo{margin:6px 20px 0;background:var(--panel);color:var(--panel-ink);border-left:8px solid var(--gc);border-radius:10px;padding:9px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.goalinfo b{font-size:15px}.goalinfo span{font-size:13px;color:var(--ink-soft);flex:1 1 300px}
.gtag{display:inline-block;background:var(--gc);color:#fff;font-weight:700;border-radius:4px;padding:1px 6px;text-shadow:0 1px 1px rgba(0,0,0,.3);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
button.gtag{border:none;cursor:pointer;font-size:12px;padding:2px 8px}
.ago{color:#6b5843;white-space:nowrap}
.ago.old{color:#a0522d}
.board{grid-template-columns:repeat(var(--ncol,6),minmax(210px,1fr))}
.col.ab{background:repeating-linear-gradient(135deg,rgba(80,70,60,.10) 0 10px,rgba(80,70,60,.04) 10px 20px);border-style:dashed}
.col.ab .colhead{background:#e9e1d6}
html[data-theme="dark"] .col.ab .colhead{background:#2a241f}
.col.ab .note{filter:grayscale(.55);opacity:.85}
.col.ab .note h3{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.stamp{position:absolute;right:8px;bottom:22px;transform:rotate(-9deg);border:2px solid #9b3b2a;color:#9b3b2a;font-weight:800;font-size:10px;letter-spacing:1px;padding:0 5px;border-radius:3px;opacity:.7;text-transform:uppercase}
.abtoggle{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);min-height:200px;border:2px dashed rgba(60,40,20,.35);border-radius:14px;background:rgba(255,248,235,.25);cursor:pointer;font-family:var(--hand);font-size:15px;color:#3a2616;padding:12px 6px;gap:8px}
.abtoggle:hover{background:rgba(255,248,235,.5)}
html[data-theme="dark"] .abtoggle{color:var(--ink-soft);border-color:rgba(255,230,200,.2);background:rgba(0,0,0,.2)}
.board.withab{grid-template-columns:repeat(var(--ncol,6),minmax(210px,1fr)) 48px}
/* timeline */
.tline{list-style:none;margin:8px 0 0;padding:0 0 0 4px;position:relative}
.tline::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--c),rgba(0,0,0,.12))}
.tline li{position:relative;padding:0 0 12px 28px}
.tline li::before{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:3px solid var(--c)}
.tline li.first::before{background:var(--c);width:12px;height:12px;left:3px;top:3px}
.tline li.future::before{border-style:dashed;opacity:.6}
.tline .td{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px}
.tline .td .ap{font-weight:600;background:rgba(0,0,0,.07);border-radius:4px;padding:0 5px;margin-left:5px}
.tline .tk{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;background:var(--c);color:#fff;border-radius:3px;padding:0 5px;margin-left:6px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.tline .tt{font-size:14px;line-height:1.45;margin-top:1px}
.tline .tn{font-size:11.5px;font-weight:700;border-radius:3px;padding:0 5px;margin-right:5px;cursor:pointer;background:var(--nc);color:#fff;border:none}
.srcline{font-size:11.5px;color:var(--ink-soft);margin-top:8px;font-style:italic}
.stbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:10px 0 4px;background:rgba(0,0,0,.08)}
.stbar i{display:block;height:100%}
.stleg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink-soft)}
.stleg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:4px}
@media (max-width:760px){
  .goals{padding:10px 12px 4px;gap:8px}
  .goal{min-width:140px}
  .goalinfo{margin:6px 12px 0}
  .board,.board.withab{grid-template-columns:repeat(var(--ncol,6),86vw)}
  .abtoggle{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="titlebar">
    <h1>📌 ONTOLOGY Kanban</h1>
    <span class="meta">v4 · bot data from <b id="updated"></b></span>
    <div class="totals" id="totals"></div>
  </div>
  <div class="toolbar">
    <button class="waitbtn" id="waitBtn" aria-pressed="false" title="Highlight every note whose next step is a decision or action by you">⏳ Waiting on Julius <span class="n" id="waitN">0</span></button>
    <input class="search" id="q" type="search" placeholder="Search notes, goals, history…" aria-label="Search">
    <select class="sel" id="ownerSel" aria-label="Filter by bot"><option value="">All bots</option></select>
    <button class="switch" id="abBtn" aria-pressed="false" title="Show the Abandoned / Superseded column"><span class="knob"></span>Abandoned <span id="abN"></span></button>
    <button class="tbtn primary" id="addBtn">＋ Sticky note</button>
    <button class="tbtn" id="exportBtn" title="Download the current board as JSON">⤓ Export</button>
    <button class="tbtn" id="resetBtn" title="Undo your drag-and-drop moves">↺ Reset</button>
    <button class="tbtn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
  </div>
</header>
<nav class="realms" id="realms" aria-label="Realms"></nav>
<nav class="goals" id="goals" aria-label="Goals"></nav>
<div id="goalinfo"></div>
<div class="status" id="status"></div>
<main class="board" id="board"></main>
<footer class="foot" id="footer" hidden></footer>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pTitle"></aside>
<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>New sticky note</h2>
    <label for="fTitle">Title</label><input id="fTitle" required maxlength="80" placeholder="e.g. Buy a real corkboard">
    <div class="row">
      <div><label for="fRealm">Realm</label><select id="fRealm"></select></div>
      <div><label for="fStage">Column</label><select id="fStage"></select></div>
    </div>
    <label for="fGoal">Goal (optional)</label><select id="fGoal"></select>
    <label for="fSum">Note</label><textarea id="fSum" rows="3" maxlength="400" placeholder="One line about it"></textarea>
    <label for="fNext">Next step (optional)</label><input id="fNext" maxlength="200">
    <label style="text-transform:none;letter-spacing:0;font-size:13.5px;display:flex;gap:8px;align-items:center;color:inherit"><input type="checkbox" id="fWait" style="width:auto"> This is waiting on me</label>
    <menu><button class="pbtn" value="cancel" formnovalidate>Cancel</button><button class="pbtn" value="ok" style="background:var(--accent);color:#fff;border-color:var(--accent)">Pin it</button></menu>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<script src="projects.js"></script>
<script>
(function(){
"use strict";
const META = window.BOARD_META || {stages:["Idea","Planning","Design","In Progress","Built / Shipped","Paused","Abandoned / Superseded"],realms:[],updated:"",title:"ONTOLOGY Kanban"};
const STAGES = META.stages, AB = "Abandoned / Superseded";
const MAIN_STAGES = STAGES.filter(s=>s!==AB);
const BASE_ITEMS = (window.ITEMS||[]).map(p=>Object.assign({},p));
const GOALS = (window.GOALS||[]).map(g=>Object.assign({},g));
const REALMS = META.realms.length?META.realms:[{id:"OTHER",label:"OTHER"}];
const REALM_COLORS = {EDUCATION:"#f6c445",LIFE:"#6fd19c",HEALTH:"#4fc3d9",MEDIA:"#ff7f7f",TOOLS:"#8fa0ff",OTHER:"#c9b29a"};
const NOTE_BG = {EDUCATION:"#fff3c2",LIFE:"#dcf5e7",HEALTH:"#d8f3f8",MEDIA:"#ffe0e0",TOOLS:"#e6e9ff",OTHER:"#f4ece2",mine:"#fff9a8"};
const STAGE_COLORS = {"Idea":"#9b7bd8","Planning":"#3b8fe2","Design":"#e28a2b","In Progress":"#e2513b","Built / Shipped":"#3aa76d","Paused":"#8a7d70","Abandoned / Superseded":"#6b5f55"};
const PFX = META.storagePrefix||"juliusKanban";
const LS = {ov:PFX+".overrides.v1", mine:PFX+".custom.v1", theme:PFX+".theme", ui:PFX+".ui.v4"};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Couldn't save (storage blocked)")}}
};
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const goalById = id=>GOALS.find(g=>g.id===id);
// ---- load + migrate saved state (v3 card ids carry over; v3 big-project moves are dropped) ----
let overrides = store.get(LS.ov,{});
let mine = store.get(LS.mine,[]);
(function migrate(){
  const ids=new Set(BASE_ITEMS.map(i=>i.id)), mig=META.migrate||{}; let changed=false; const out={};
  for(const [k,v] of Object.entries(overrides)){
    let id=k;
    if(Object.prototype.hasOwnProperty.call(mig,k)){ id=mig[k]; changed=true; if(!id) continue; }
    if(!ids.has(id)||!v||!STAGES.includes(v.stage)){ changed=true; continue; }
    const base=BASE_ITEMS.find(b=>b.id===id); if(base.stage===v.stage){ changed=true; continue; }
    out[id]=v;
  }
  mine=mine.map(m=>{ if(m.project&&!m.goal){ changed=true; const o=Object.assign({},m); delete o.project; return o;} return m; });
  overrides=out; if(changed){ store.set(LS.ov,overrides); store.set(LS.mine,mine); }
})();
const ui = store.get(LS.ui,{});
const state = {realm:ui.realm||"", goal:"", owner:"", q:"", wait:false, ab:!!ui.ab};
const saveUI = ()=>store.set(LS.ui,{realm:state.realm,ab:state.ab});
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function liveA(x,cls){ if(!x.liveUrl) return ""; const t=x.liveLabel||"Open live site";
  return `<a class="${cls||"live"}" href="${esc(x.liveUrl)}" target="_blank" rel="noopener noreferrer" title="${esc(t)}" aria-label="${esc(t)}" data-live="1">${cls?"↗ "+esc(t):"↗"}</a>`; }
// ---- dates ----
const todayStr = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayNum = s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5};
function daysAgo(s){ if(!s) return null; return Math.max(0,Math.round(dayNum(todayStr())-dayNum(s))); }
function agoText(s,long){ const n=daysAgo(s); if(n==null) return long?"not dated":""; if(n===0) return long?"today":"today"; return long?`${n} day${n===1?"":"s"} ago`:`${n}d ago`; }
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s=>{const [y,m,d]=s.split("-").map(Number);return `${MONTHS[m-1]} ${d}, ${y}`};
// ---- theme ----
const savedTheme = store.get(LS.theme,null);
function applyTheme(t){document.documentElement.dataset.theme=t}
applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#themeBtn").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";applyTheme(t);store.set(LS.theme,t)};
// ---- model ----
function items(){
  const base = BASE_ITEMS.map(p=>{
    const o = overrides[p.id]; const stage = (o && STAGES.includes(o.stage)) ? o.stage : p.stage;
    return Object.assign({}, p, {stage, botStage:p.stage, moved: !!(o && o.stage!==p.stage), mine:false});
  });
  const m = mine.map(p=>{ const g=p.goal&&goalById(p.goal);
    return Object.assign({owners:["Julius"],done:"",next:"",links:[],files:[],history:[]},p,{realm:g?g.realm:(REALMS.some(r=>r.id===p.realm)?p.realm:"OTHER"),goal:g?g.id:"",mine:true,botStage:p.stage,moved:false,
      lastTouched:p.updated,history:(p.history&&p.history.length)?p.history:[{date:p.updated,approx:false,text:"Pinned by you",kind:"first"}]}); });
  return base.concat(m);
}
function textOf(p){const g=p.goal&&goalById(p.goal);return [p.title,p.summary,p.done,p.next,p.decision,p.note,p.stageNote,g?g.title:"",(p.owners||[]).join(" "),(p.files||[]).join(" "),(p.history||[]).map(h=>h.text).join(" "),(p.links||[]).map(l=>l.label+" "+l.url).join(" ")].join(" ").toLowerCase()}
const words = ()=>state.q.toLowerCase().split(/\s+/).filter(Boolean);
const match = i => (!state.owner || (i.owners||[]).includes(state.owner)) && (!state.q || words().every(w=>textOf(i).includes(w)));
const inScope = i => (!state.realm || i.realm===state.realm) && (!state.goal || i.goal===state.goal);
// ---- render ----
let snapNext=true;
function stageBar(list,cls){ const n=list.length||1; return `<div class="${cls}">`+STAGES.map(s=>{const k=list.filter(i=>i.stage===s).length;return k?`<i style="width:${100*k/n}%;background:${STAGE_COLORS[s]}" title="${esc(s)}: ${k}"></i>`:""}).join("")+`</div>`; }
function render(){
  const all = items();
  const realmItems = all.filter(i=>!state.realm||i.realm===state.realm);
  const realmGoals = GOALS.filter(g=>!state.realm||g.realm===state.realm);
  if(state.goal && !realmGoals.some(g=>g.id===state.goal)) state.goal="";
  $("#updated").textContent = META.updated;
  const scoped = all.filter(inScope);
  const live = scoped.filter(i=>i.stage!==AB);
  const waitN = live.filter(i=>i.waitingOnJulius).length;
  $("#waitN").textContent = waitN;
  const abN = scoped.filter(i=>i.stage===AB).length;
  $("#abN").textContent = `(${abN})`;
  $("#totals").innerHTML = `<span class="tot">${esc(state.goal?goalById(state.goal).title:(state.realm||"All realms"))}</span>`+
    (state.goal?"":`<span class="tot"><b>${realmGoals.length}</b> goals</span>`)+
    `<span class="tot"><b>${live.length}</b> notes</span><span class="tot"><b>${live.filter(i=>i.stage==="Built / Shipped").length}</b> built</span><span class="tot wt"><b>${waitN}</b> waiting on you</span>`;
  // realms
  const rtab=(id,label,c,gs,is)=>{const a=is.filter(i=>i.stage!==AB);const w=a.filter(i=>i.waitingOnJulius).length;
    return `<button class="realm ${a.length?"":"empty0"}" style="--c:${c}" data-realm="${id}" aria-pressed="${state.realm===id}"><span class="rn">${esc(label)}</span><span class="rs">${gs.length} goal${gs.length===1?"":"s"} · ${a.length} notes${w?` · <span class="rw">⏳ ${w}</span>`:""}</span></button>`;};
  $("#realms").innerHTML = rtab("","All","#ffb347",GOALS,all) + REALMS.map(r=>rtab(r.id,r.label,REALM_COLORS[r.id]||"#ccc",GOALS.filter(g=>g.realm===r.id),all.filter(i=>i.realm===r.id))).join("");
  // goal banners
  const gEl=$("#goals"); gEl.classList.toggle("dim",!!state.goal);
  gEl.innerHTML = `<button class="goal allg" data-goal="" aria-pressed="${!state.goal}"><span class="gt">All goals</span><span class="gs">${realmGoals.length} banners</span></button>`+
    realmGoals.map(g=>{ const ks=all.filter(i=>i.goal===g.id); const act=ks.filter(i=>i.stage!==AB); const w=act.filter(i=>i.waitingOnJulius).length;
      return `<button class="goal" style="--gc:${g.color}" data-goal="${g.id}" aria-pressed="${state.goal===g.id}" title="${esc(g.description)}"><span class="gt">${esc(g.title)}</span>
        <span class="gs">${act.length} note${act.length===1?"":"s"}${!state.realm?" · "+esc(g.realm):""}${w?`<span class="gw">⏳ ${w}</span>`:""}</span>${stageBar(ks,"gbar")}
        <span class="tl" role="button" tabindex="0" data-tl="${g.id}" title="Open ${esc(g.title)}'s timeline" aria-label="Open ${esc(g.title)} timeline">🕑</span></button>`;}).join("");
  // goal info strip
  const gi=$("#goalinfo");
  if(state.goal){ const g=goalById(state.goal); gi.innerHTML=`<div class="goalinfo" style="--gc:${g.color}"><b>🎯 ${esc(g.title)}</b><span>${esc(g.description)}</span><button class="pbtn" id="giTl">🕑 Goal timeline & overview</button><button class="pbtn" id="giX">× Show all goals</button></div>`;
    $("#giTl").onclick=()=>openGoal(g.id); $("#giX").onclick=()=>{state.goal="";render()}; }
  else gi.innerHTML="";
  // owners
  const owners=[...new Set(all.flatMap(c=>c.owners||[]))].sort((a,b)=>a.localeCompare(b));
  $("#ownerSel").innerHTML=`<option value="">All bots (${owners.length})</option>`+owners.map(o=>`<option ${o===state.owner?"selected":""} value="${esc(o)}">${esc(o)} · ${all.filter(c=>(c.owners||[]).includes(o)).length}</option>`).join("");
  document.body.classList.toggle("waitmode",state.wait);
  $("#waitBtn").setAttribute("aria-pressed",state.wait);
  $("#abBtn").setAttribute("aria-pressed",state.ab);
  const shown = scoped.filter(match);
  const cols = state.ab ? STAGES : MAIN_STAGES;
  const parts=[];
  parts.push(state.goal?`Goal: ${goalById(state.goal).title}`:"Notes from every goal · tap a banner to focus one goal, 🕑 for its timeline");
  if(state.wait) parts.push(`${shown.filter(c=>c.waitingOnJulius&&c.stage!==AB).length} note(s) waiting on you`);
  if(state.owner||state.q) parts.push(`${shown.length} match`);
  const movedN = Object.keys(overrides).length; if(movedN) parts.push(`${movedN} note(s) moved by you`);
  if(!state.ab&&abN) parts.push(`${abN} abandoned/superseded hidden`);
  $("#status").textContent=parts.join(" · ");
  const board=$("#board"); board.innerHTML=""; board.style.setProperty("--ncol",cols.length);
  board.classList.toggle("withab",!state.ab);
  for(const s of cols){
    let list=shown.filter(c=>c.stage===s);
    list.sort((a,b)=>(state.wait?((b.waitingOnJulius?1:0)-(a.waitingOnJulius?1:0)):0) || GOALS.findIndex(g=>g.id===a.goal)-GOALS.findIndex(g=>g.id===b.goal) || String(b.lastTouched||"").localeCompare(String(a.lastTouched||"")));
    const total=scoped.filter(i=>i.stage===s).length;
    const col=document.createElement("section"); col.className="col"+(s===AB?" ab":""); col.dataset.stage=s; col.style.setProperty("--sc",STAGE_COLORS[s]);
    col.innerHTML=`<div class="colhead"><h2>${esc(s)}</h2>${s===AB?'<button class="pbtn" id="abHide" title="Hide this column" style="padding:1px 7px;font-size:12px">hide</button>':""}<span class="count" title="${list.length} shown of ${total}">${list.length===total?total:list.length+"/"+total}</span></div><div class="cards"></div>`;
    const wrap=col.querySelector(".cards");
    if(!list.length) wrap.innerHTML=`<div class="empty">Nothing here${(state.owner||state.q||state.goal)?" for this filter":""}</div>`;
    for(const c of list) wrap.appendChild(noteEl(c));
    board.appendChild(col);
  }
  if(!state.ab){ const t=document.createElement("button"); t.className="abtoggle"; t.id="abShow"; t.title="Show the Abandoned / Superseded column"; t.innerHTML=`🗄 Abandoned / Superseded (${abN}) ▸`; t.onclick=()=>{state.ab=true;saveUI();render()}; board.appendChild(t); }
  const h=$("#abHide"); if(h) h.onclick=()=>{state.ab=false;saveUI();render()};
  if(snapNext){ snapNext=false; if(window.innerWidth<=760){ const first=[...board.querySelectorAll(".col")].find(c=>c.querySelector(".note")); board.scrollLeft = first ? first.offsetLeft-12 : 0; } }
}
function stampOf(p){ const t=((p.history||[]).slice(-1)[0]||{}).text||""; const s=t+" "+(p.stageNote||""); return /merged/i.test(s)?"merged":/early exploration/i.test(s)?"explored":/supersed|replaced|successor/i.test(s)?"superseded":"abandoned"; }
function noteEl(p){
  const d=document.createElement("article");
  d.className="note"+(p.waitingOnJulius&&p.stage!==AB?" waiting":"");
  d.tabIndex=0; d.dataset.id=p.id;
  const g=p.goal&&goalById(p.goal);
  d.style.setProperty("--c",g?g.color:"#f0d84a");
  d.style.setProperty("--nb",p.mine?NOTE_BG.mine:(NOTE_BG[p.realm]||"#fffbe6"));
  d.style.setProperty("--rot",((hash(p.id)%5)*0.45-0.9).toFixed(2)+"deg");
  const owners=p.owners||[]; const n=daysAgo(p.lastTouched);
  d.innerHTML=`<span class="pin"></span>${liveA(p)}<h3>${esc(p.title)}</h3><div class="sum">${esc(p.summary||"")}</div>
   <div class="foot">${g?`<span class="gtag" style="--gc:${g.color}">${esc(g.title)}</span>`:`<span class="tag realm-t" style="--c:${REALM_COLORS[p.realm]}">${esc(p.realm)}</span>`}<span class="tag owner">🤖 ${esc(owners[0]||"")}${owners.length>1?" +"+(owners.length-1):""}</span>
   ${n!=null?`<span class="ago${n>=7?" old":""}" title="Last touched ${esc(p.lastTouched)}">🕑 ${agoText(p.lastTouched)}</span>`:""}
   ${p.waitingOnJulius&&p.stage!==AB?'<span class="badge-wait" title="'+esc(p.decision||"")+'">⏳ You</span>':""}${p.moved?'<span class="badge-moved" title="Bot data says: '+esc(p.botStage)+'">↔ moved</span>':""}${p.mine?'<span class="badge-mine">✎ yours</span>':""}</div>
   ${p.stage===AB?`<span class="stamp">${stampOf(p)}</span>`:""}`;
  d.setAttribute("aria-label",p.title+", "+p.stage+(g?", goal "+g.title:"")+(p.waitingOnJulius?", waiting on you":""));
  d.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openItem(p.id)}});
  attachDrag(d,p.id,()=>openItem(p.id));
  return d;
}
// ---- drag & drop (mouse drag, touch long-press) ----
let drag=null, suppressClick=false;
function attachDrag(el,id,onOpen){
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0 || e.target.closest("[data-live]")) return;
    const start={x:e.clientX,y:e.clientY}; let timer=null, started=false; const isTouch=e.pointerType!=="mouse";
    const begin=(x,y)=>{ started=true; const r=el.getBoundingClientRect();
      const g=el.cloneNode(true); g.classList.add("ghost"); g.style.width=r.width+"px"; g.style.left=r.left+"px"; g.style.top=r.top+"px";
      document.body.appendChild(g); el.classList.add("dragging-src"); drag={id,ghost:g,dx:x-r.left,dy:y-r.top,over:null};
      if(navigator.vibrate&&isTouch) try{navigator.vibrate(15)}catch(_){} };
    const move=ev=>{
      if(!started){ const dist=Math.hypot(ev.clientX-start.x,ev.clientY-start.y);
        if(isTouch){ if(dist>10) cleanup(); return; } if(dist>6) begin(ev.clientX,ev.clientY); else return; }
      ev.preventDefault();
      drag.ghost.style.left=(ev.clientX-drag.dx)+"px"; drag.ghost.style.top=(ev.clientY-drag.dy)+"px";
      const under=document.elementFromPoint(ev.clientX,ev.clientY); const col=under&&under.closest(".col");
      if(drag.over&&drag.over!==col) drag.over.classList.remove("over"); if(col) col.classList.add("over"); drag.over=col;
      const b=$("#board"),br=b.getBoundingClientRect();
      if(ev.clientX<br.left+40) b.scrollLeft-=14; else if(ev.clientX>br.right-40) b.scrollLeft+=14;
    };
    const up=()=>{ clearTimeout(timer);
      if(started){ suppressClick=true; setTimeout(()=>suppressClick=false,50);
        const col=drag.over; drag.ghost.remove(); el.classList.remove("dragging-src"); if(col) col.classList.remove("over");
        if(col&&col.dataset.stage) moveCard(drag.id,col.dataset.stage); drag=null; }
      cleanup(); };
    const blockScroll=ev=>{if(started)ev.preventDefault()};
    const cleanup=()=>{clearTimeout(timer);window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);el.removeEventListener("touchmove",blockScroll)};
    if(isTouch){ timer=setTimeout(()=>begin(start.x,start.y),380); el.addEventListener("touchmove",blockScroll,{passive:false}); }
    window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  });
  el.addEventListener("click",e=>{ if(e.target.closest("[data-live]")) return; if(!suppressClick) onOpen() });
}
function moveCard(id,stage){
  const c=items().find(x=>x.id===id); if(!c||c.stage===stage) return;
  if(c.mine){ mine=mine.map(m=>m.id===id?Object.assign({},m,{stage}):m); store.set(LS.mine,mine); }
  else{ const base=BASE_ITEMS.find(b=>b.id===id);
    if(base.stage===stage) delete overrides[id]; else overrides[id]={stage,movedAt:new Date().toISOString()};
    store.set(LS.ov,overrides); }
  render(); toast(`Moved “${c.title}” → ${stage}`); refreshPanel();
}
// ---- panels ----
let view=null;
function refreshPanel(){ if(!view) return; view.type==="goal"?openGoal(view.id,true):openItem(view.id,view.from,true); }
function showPanel(color){ const pan=$("#panel"); pan.style.setProperty("--c",color);
  pan.classList.add("open"); pan.setAttribute("aria-hidden","false"); $("#scrim").classList.add("open"); pan.querySelector(".close").onclick=closePanel; return pan; }
function stageSelect(cur){return `<select id="mv" class="psel">${STAGES.map(s=>`<option ${s===cur?"selected":""}>${esc(s)}</option>`).join("")}</select>`}
function timeline(hist,opts){
  opts=opts||{}; if(!hist||!hist.length) return `<p class="pmeta">${esc(opts.empty||"No history recorded.")}</p>`;
  const t=todayStr();
  return `<ol class="tline">`+hist.map((h,k)=>{ const fut=h.date>t; const first=h.kind==="first";
    const lbl= first?"First discussed":(fut?"Scheduled":"");
    const nn = h.note?`<button class="tn" style="--nc:${h.nc||"#8a7d70"}" data-kid="${esc(h.note)}">${esc(h.noteTitle)}</button>`:"";
    return `<li class="${first?"first":""}${fut?" future":""}"><div class="td">${esc(fmtDate(h.date))}${h.approx?'<span class="ap" title="Approximate date">≈ approx</span>':""}${lbl&&!opts.combined?`<span class="tk">${lbl}</span>`:""}</div><div class="tt">${nn}${esc(h.text)}</div></li>`; }).join("")+`</ol>`;
}
function openItem(id,from,keep){
  const p=items().find(x=>x.id===id); if(!p) return;
  view={type:"item",id,from};
  const pan=$("#panel"); const g=p.goal&&goalById(p.goal);
  const li=a=>a.length?`<ul>${a.join("")}</ul>`:"";
  const links=(p.links||[]).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a> <span class="pmeta">${esc(l.url.replace(/^https?:\/\//,""))}</span></li>`);
  const files=(p.files||[]).map(f=>`<li><code>${esc(f)}</code></li>`);
  pan.innerHTML=`<div class="phead"><button class="close" aria-label="Close">×</button>
    ${from&&g?`<button class="back" id="backBtn">← ${esc(g.title)}</button><br>`:""}
    ${g?`<button class="gtag" id="goalBtn" style="--gc:${g.color}" title="Open this goal">🎯 ${esc(g.title)}</button> `:""}<span class="tag realm-t" style="--c:${REALM_COLORS[p.realm]};border-radius:4px;padding:2px 7px;font-size:12px">${esc(p.realm)}</span>
    <h2 id="pTitle">${esc(p.title)}</h2>
    <div class="pmeta">🤖 ${esc((p.owners||[]).join(", "))} · 🕑 last touched ${esc(agoText(p.lastTouched,true))}${p.lastTouched?` (${esc(fmtDate(p.lastTouched))})`:""}</div>
    <div class="prow"><label class="pmeta" for="mv">Column</label>${stageSelect(p.stage)}
    ${p.moved?`<button class="pbtn" id="undoMove">↺ Back to bot's “${esc(p.botStage)}”</button>`:""}
    ${p.mine?`<button class="pbtn danger" id="delMine">Delete note</button>`:""}</div>
  </div>
  <div class="pbody">
    ${p.liveUrl?`<div class="prow" style="margin-top:12px">${liveA(p,"livebtn")}</div>`:""}
    ${p.waitingOnJulius?`<div class="waitbox">⏳ Waiting on you: ${esc(p.decision||p.next||"")}</div>`:""}
    ${p.summary?`<h4>What it is</h4><p>${esc(p.summary)}</p>`:""}
    ${p.stageNote||p.moved?`<h4>Stage (bot's words)</h4><p>${esc(p.stageNote||p.botStage)}${p.moved?` <span class="pmeta">— you moved it to ${esc(p.stage)}</span>`:""}</p>`:""}
    ${p.done?`<h4>Done</h4><p>${esc(p.done)}</p>`:""}
    ${p.next?`<h4>Next / open</h4><p>${esc(p.next)}</p>`:""}
    ${p.note?`<div class="notebox">${esc(p.note)}</div>`:""}
    <h4>History</h4>${timeline(p.history,{empty:p.historyNote})}
    ${p.source?`<div class="srcline">Source: ${esc(p.source)}</div>`:""}
    ${links.length?`<h4>Links</h4>${li(links)}`:""}
    ${files.length?`<h4>Files</h4>${li(files)}`:""}
  </div>`;
  showPanel(g?g.color:"#f0d84a");
  pan.querySelector("#mv").onchange=e=>moveCard(p.id,e.target.value);
  const u=pan.querySelector("#undoMove"); if(u) u.onclick=()=>moveCard(p.id,p.botStage);
  const bk=pan.querySelector("#backBtn"); if(bk) bk.onclick=()=>openGoal(g.id);
  const gb=pan.querySelector("#goalBtn"); if(gb) gb.onclick=()=>openGoal(g.id);
  const del=pan.querySelector("#delMine"); if(del) del.onclick=()=>{ if(confirm("Delete this sticky note?")){mine=mine.filter(m=>m.id!==p.id);store.set(LS.mine,mine);closePanel();render();}};
  if(!keep) setTimeout(()=>pan.querySelector(".close").focus(),50);
}
function openGoal(id,keep){
  const g=goalById(id); if(!g) return; view={type:"goal",id};
  const pan=$("#panel"); const ks=items().filter(i=>i.goal===id); const act=ks.filter(k=>k.stage!==AB);
  const wait=act.filter(k=>k.waitingOnJulius); const lives=ks.filter(k=>k.liveUrl);
  const groups=STAGES.map(s=>{ const a=ks.filter(k=>k.stage===s); if(!a.length) return "";
    return `<div class="sg" style="--sc:${STAGE_COLORS[s]}"><h5><span class="dot"></span>${esc(s)} · ${a.length}</h5>`+a.map(k=>`<button class="kid" data-kid="${esc(k.id)}" style="--c:${g.color};--nb:${k.mine?NOTE_BG.mine:NOTE_BG[g.realm]}"><b>${esc(k.title)}${k.liveUrl?' <span title="Has a live site" style="font-size:12px">↗</span>':""}</b><span>${esc(k.summary||"")}</span>
      <div class="kb">${k.waitingOnJulius&&k.stage!==AB?'<span class="badge-wait">⏳ You</span>':""}${k.moved?'<span class="badge-moved">↔ moved</span>':""}${k.mine?'<span class="badge-mine">✎ yours</span>':""}<span class="tag owner">🤖 ${esc((k.owners||[]).join(", "))}</span>${k.lastTouched?`<span class="ago">🕑 ${agoText(k.lastTouched)}</span>`:""}</div></button>`).join("")+`</div>`; }).join("");
  // combined timeline: goal milestones + every note's entries, oldest first
  const comb=[];
  for(const k of ks) for(const h of (k.history||[])) comb.push(Object.assign({},h,{note:k.id,noteTitle:k.title,nc:STAGE_COLORS[k.stage]}));
  comb.sort((a,b)=>a.date.localeCompare(b.date)||((a.kind==="first"?0:1)-(b.kind==="first"?0:1)));
  const gm=(g.history||[]).map(h=>`<li class="first"><div class="td">${esc(fmtDate(h.date))}${h.approx?'<span class="ap">≈ approx</span>':""}</div><div class="tt">${esc(h.text)}</div></li>`).join("");
  pan.innerHTML=`<div class="phead"><button class="close" aria-label="Close">×</button>
    <span class="gtag" style="--gc:${g.color}">🎯 Goal</span> <span class="tag realm-t" style="--c:${REALM_COLORS[g.realm]};border-radius:4px;padding:2px 7px;font-size:12px">${esc(g.realm)}</span>
    <h2 id="pTitle">${esc(g.title)}</h2><div class="pmeta">🤖 ${esc((g.owners||[]).join(", "))}</div>
    <div class="prow"><button class="pbtn" id="focusGoal">${state.goal===g.id?"✓ Showing only this goal's notes":"Show only this goal's notes on the board"}</button></div></div>
  <div class="pbody">
    <p style="margin-top:10px">${esc(g.description)}</p>
    ${stageBar(ks,"stbar")}<div class="stleg">${STAGES.map(s=>{const n=ks.filter(k=>k.stage===s).length;return n?`<span style="--sc:${STAGE_COLORS[s]}">${esc(s)} ${n}</span>`:""}).join("")}</div>
    ${wait.length?`<div class="waitbox">⏳ ${wait.length} waiting on you<ul class="wl">${wait.map(k=>`<li><a data-kid="${esc(k.id)}">${esc(k.title)}</a>: ${esc(k.decision||k.next||"")}</li>`).join("")}</ul></div>`:""}
    ${g.note?`<div class="notebox">${esc(g.note)}</div>`:""}
    ${lives.length?`<h4>Live sites</h4><ul class="vlist">${lives.map(k=>`<li><a href="${esc(k.liveUrl)}" target="_blank" rel="noopener noreferrer">↗ ${esc(k.title)}</a></li>`).join("")}</ul>${g.liveNote?`<p class="pmeta">${esc(g.liveNote)}</p>`:""}`:""}
    ${gm?`<h4>Milestones</h4><ol class="tline" style="--c:${g.color}">${gm}</ol>`:""}
    <h4>Notes by stage</h4>${groups||'<p class="pmeta">No notes yet.</p>'}
    <h4>Combined timeline (${comb.length} entries)</h4>${comb.length?timeline(comb,{combined:true}):'<p class="pmeta">History kept private.</p>'}
  </div>`;
  showPanel(g.color);
  pan.querySelector("#focusGoal").onclick=()=>{state.goal=g.id;snapNext=true;render();openGoal(g.id,true);};
  pan.querySelectorAll("[data-kid]").forEach(b=>b.onclick=()=>openItem(b.dataset.kid,g.id));
  if(!keep) setTimeout(()=>pan.querySelector(".close").focus(),50);
}
function closePanel(){ view=null; $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden","true"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick=closePanel;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&view) closePanel(); if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus();} });
// ---- controls ----
$("#realms").addEventListener("click",e=>{const b=e.target.closest(".realm"); if(!b) return; state.realm=b.dataset.realm; state.goal=""; saveUI(); snapNext=true; render();});
$("#goals").addEventListener("click",e=>{ const t=e.target.closest("[data-tl]"); if(t){ e.stopPropagation(); openGoal(t.dataset.tl); return; }
  const b=e.target.closest(".goal"); if(!b) return; const v=b.dataset.goal; state.goal=(state.goal===v?"":v); snapNext=true; render(); });
$("#goals").addEventListener("keydown",e=>{ const t=e.target.closest("[data-tl]"); if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.stopPropagation();openGoal(t.dataset.tl);} });
$("#ownerSel").onchange=e=>{state.owner=e.target.value;render()};
let qt; $("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();render()},120)});
$("#waitBtn").onclick=()=>{state.wait=!state.wait;render()};
$("#abBtn").onclick=()=>{state.ab=!state.ab;saveUI();render()};
$("#resetBtn").onclick=()=>{ const n=Object.keys(overrides).length;
  if(!n){toast("Nothing to reset — board matches bot data");return}
  if(confirm(`Put ${n} moved note(s) back where the bots placed them? (Your own sticky notes stay.)`)){overrides={};store.set(LS.ov,overrides);render();refreshPanel();toast("Reset to bot data")} };
$("#exportBtn").onclick=()=>{
  const all=items();
  const data={exported:new Date().toISOString(),title:META.title,version:META.version,botDataUpdated:META.updated,stages:STAGES,realms:REALMS,
    goals:GOALS.map(g=>Object.assign({},g,{notes:all.filter(i=>i.goal===g.id).map(i=>i.id)})),
    items:all.map(({moved,botStage,mine,...rest})=>Object.assign(rest,{column:rest.stage,botColumn:botStage,movedByJulius:moved,juliusNote:mine,lastTouchedDaysAgo:daysAgo(rest.lastTouched)})),overrides};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ontology-kanban-v4-"+todayStr()+".json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); toast("Board exported"); };
const dlg=$("#addDlg");
$("#fRealm").innerHTML=REALMS.map(r=>`<option value="${r.id}">${esc(r.label)}</option>`).join("");
$("#fStage").innerHTML=STAGES.map(s=>`<option>${esc(s)}</option>`).join("");
const fillGoal=()=>{const r=$("#fRealm").value;$("#fGoal").innerHTML=`<option value="">— No goal (loose note) —</option>`+GOALS.filter(g=>g.realm===r).map(g=>`<option value="${g.id}" ${state.goal===g.id?"selected":""}>${esc(g.title)}</option>`).join("")};
$("#fRealm").onchange=fillGoal;
$("#addBtn").onclick=()=>{ $("#addForm").reset(); $("#fRealm").value=state.goal?goalById(state.goal).realm:(state.realm||"OTHER"); fillGoal(); if(dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); $("#fTitle").focus(); };
dlg.addEventListener("close",()=>{
  if(dlg.returnValue!=="ok") return; const t=$("#fTitle").value.trim(); if(!t) return;
  const wait=$("#fWait").checked, next=$("#fNext").value.trim(), d=todayStr();
  mine.push({id:"mine-"+Date.now().toString(36),title:t,realm:$("#fRealm").value,goal:$("#fGoal").value,owners:["Julius"],stage:$("#fStage").value,summary:$("#fSum").value.trim(),
    done:"",next,links:[],files:[],updated:d,history:[{date:d,approx:false,text:"Pinned by you",kind:"first"}],waitingOnJulius:wait,decision:wait?(next||t):undefined});
  store.set(LS.mine,mine); render(); toast("Pinned your note"); });
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1800)}
if(META.footer){const f=$("#footer");f.textContent=META.footer;f.hidden=false;}
if(META.public){ $("#waitBtn").title="Highlight items waiting on a decision by Julius"; }
render();
if(!BASE_ITEMS.length){ $("#status").textContent="Couldn't load projects.js — keep it in the same folder as index.html."; }
window.__kanban={items,moveCard,state,render,openGoal,openItem,GOALS};
})();
</script>
</body>
